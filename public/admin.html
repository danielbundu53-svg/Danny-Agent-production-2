<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Enquiries</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#123B63">
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="bg-gray-50 text-gray-900">
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
      <div>
        <p class="text-sm font-bold tracking-widest text-amber-600 uppercase" id="brand">Admin</p>
        <h1 class="text-3xl font-bold text-slate-800">Property Enquiries</h1>
      </div>

      <form id="loginForm" class="flex gap-2" autocomplete="off">
        <label for="adminKey" class="sr-only">Admin key</label>
        <input id="adminKey" type="password" placeholder="Admin key" autocomplete="current-password" class="border rounded-lg px-4 py-2 w-full md:w-64">
        <button id="loadBtn" type="submit" class="bg-slate-800 text-white rounded-lg px-5 py-2 font-semibold hover:bg-slate-700">Load</button>
      </form>

      <div id="sessionBar" class="hidden flex gap-2">
        <button id="refreshBtn" type="button" class="border rounded-lg px-4 py-2 font-semibold bg-white hover:bg-gray-50">Refresh</button>
        <button id="signOutBtn" type="button" class="border rounded-lg px-4 py-2 font-semibold bg-white hover:bg-gray-50">Sign out</button>
      </div>
    </div>

    <p id="status" class="mb-4 text-sm" role="status" aria-live="polite"></p>

    <div id="tools" class="hidden mb-4 grid gap-3 sm:grid-cols-3">
      <div class="sm:col-span-2">
        <label for="searchBox" class="sr-only">Search enquiries</label>
        <input id="searchBox" type="search" placeholder="Search name, phone, email, property or message" class="w-full border rounded-lg px-4 py-2 bg-white">
      </div>
      <div>
        <label for="statusFilter" class="sr-only">Filter by status</label>
        <select id="statusFilter" class="w-full border rounded-lg px-4 py-2 bg-white">
          <option value="">All statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="qualified">Qualified</option>
          <option value="closed">Closed</option>
        </select>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border overflow-x-auto">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-50">
          <tr>
            <th scope="col" class="text-left p-4">Date</th>
            <th scope="col" class="text-left p-4">Customer</th>
            <th scope="col" class="text-left p-4">Property</th>
            <th scope="col" class="text-left p-4">Service</th>
            <th scope="col" class="text-left p-4">Message</th>
            <th scope="col" class="text-left p-4">Status</th>
          </tr>
        </thead>
        <tbody id="inquiryRows">
          <tr><td colspan="6" class="p-8 text-left text-gray-500">Enter your admin key and press Load.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/site-config.js"></script>
  <script src="js/pages/admin.js"></script>

</html>
